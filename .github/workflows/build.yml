name: Build Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  APP_NAME: roub-crt

jobs:
  # GUI版本构建
  build-gui:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            env: ''
            gui-deps: 'libgl1-mesa-dev xorg-dev libgtk-3-dev'
          - os: windows-latest
            env: '.exe'
            gui-deps: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install GUI dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.gui-deps }}

      - name: Get dependencies
        run: |
          go mod download
          go mod tidy

      - name: Build GUI
        run: |
          mkdir -p release/${{ matrix.os }}
          go build -tags gui -ldflags="-s -w" -o release/${{ matrix.os }}/${{ env.APP_NAME }}-gui${{ matrix.env }} .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.os }}-gui
          path: release/${{ matrix.os }}/${{ env.APP_NAME }}-gui${{ matrix.env }}
          retention-days: 30

  # 上传 artifacts（每次推送都执行）
  upload-artifacts:
    needs: [build-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -type f -name "*" -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

  # 创建正式发布（只有在推送标签时执行）
  release:
    needs: [upload-artifacts]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
